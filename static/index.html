<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuChat</title>
  <style>
    /* Change --brand to match any client's brand colour */
    :root {
      --brand: #4f46e5; --bg: #f5f6fa; --card: #ffffff;
      --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    .app {
      width: 100%; max-width: 720px; height: 100%; max-height: 820px;
      background: var(--card); border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.08);
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: var(--brand); color: #fff; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    header h1 { font-size: 18px; }
    header p { font-size: 13px; opacity: .85; margin-top: 2px; }
    .upload-btn {
      background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap;
    }
    .upload-btn:hover { background: rgba(255,255,255,.25); }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #f1f2f6; border-bottom-left-radius: 4px; }
    .system { align-self: center; font-size: 13px; color: var(--muted); text-align: center; }
    .sources { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      font-size: 12px; background: #fff; border: 1px solid var(--border);
      border-radius: 999px; padding: 2px 10px; color: var(--muted); cursor: help;
    }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 12px; }
    .suggestions button {
      border: 1px solid var(--border); background: #fff; border-radius: 999px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text);
    }
    .suggestions button:hover { border-color: var(--brand); color: var(--brand); }
    form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
    input[type=text] {
      flex: 1; padding: 12px 14px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 15px; outline: none;
    }
    input[type=text]:focus { border-color: var(--brand); }
    form button { background: var(--brand); color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-size: 15px; cursor: pointer; }
    form button:disabled { opacity: .5; cursor: not-allowed; }
    .typing span {
      display: inline-block; width: 6px; height: 6px; margin: 0 2px;
      background: var(--muted); border-radius: 50%; animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
    @media (max-width: 480px) { body { padding: 0; } .app { border-radius: 0; max-height: none; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>DocuChat</h1>
        <p id="doc-name">Loading...</p>
      </div>
      <label class="upload-btn">
        Upload PDF
        <input type="file" id="file-input" accept="application/pdf" hidden>
      </label>
    </header>

    <div id="messages"></div>

    <div class="suggestions" id="suggestions">
      <button>What are the course fees?</button>
      <button>What is the refund policy?</button>
      <button>When is the office open?</button>
    </div>

    <form id="chat-form">
      <input type="text" id="question" placeholder="Ask a question about the document..." autocomplete="off">
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("send-btn");
    const fileInput = document.getElementById("file-input");
    const docName = document.getElementById("doc-name");
    const suggestions = document.getElementById("suggestions");

    const FALLBACK = "Sorry, I don't have that information";

    // Add a chat bubble. textContent keeps it safe from HTML injection (XSS).
    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // Disable input while waiting, so users can't send twice
    function setBusy(busy) {
      input.disabled = busy;
      sendBtn.disabled = busy;
    }

    // FastAPI errors come back as {"detail": "..."}
    function errorText(data, fallback) {
      return typeof data.detail === "string" ? data.detail : fallback;
    }

    async function loadStatus() {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        docName.textContent = data.document ? "Answering from: " + data.document : "No document loaded";
      } catch {
        docName.textContent = "Server not reachable";
      }
    }

    async function ask(question) {
      addMessage(question, "user");
      input.value = "";
      setBusy(true);

      const typing = addMessage("", "bot typing");
      typing.innerHTML = "<span></span><span></span><span></span>"; // fixed markup, safe

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        typing.remove();

        if (!res.ok) {
          addMessage(errorText(data, "Something went wrong."), "system");
          return;
        }

        const bubble = addMessage(data.answer, "bot");

        // Show source pages, but not when the bot said it doesn't know
        if (!data.answer.startsWith(FALLBACK)) {
          const box = document.createElement("div");
          box.className = "sources";
          const seen = new Set();
          data.sources.forEach(s => {
            if (seen.has(s.page)) return;   // show each page once
            seen.add(s.page);
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = "Page " + s.page;
            chip.title = s.text;            // hover to see the source text
            box.appendChild(chip);
          });
          bubble.appendChild(box);
        }
      } catch {
        typing.remove();
        addMessage("Can't reach the server. Is it running?", "system");
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", e => {
      e.preventDefault();               // stop the page from reloading
      const q = input.value.trim();
      if (q) ask(q);
    });

    suggestions.addEventListener("click", e => {
      if (e.target.tagName === "BUTTON") ask(e.target.textContent);
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      addMessage("Reading " + file.name + "...", "system");
      setBusy(true);

      const body = new FormData();
      body.append("file", file);       // "file" must match the parameter name in app.py

      try {
        const res = await fetch("/upload", { method: "POST", body });
        const data = await res.json();
        if (!res.ok) {
          addMessage(errorText(data, "Upload failed."), "system");
          return;
        }
        addMessage(`Ready! Read ${data.pages} pages (${data.chunks} chunks). Ask me anything about ${data.document}.`, "system");
        suggestions.style.display = "none"; // demo suggestions only fit the sample PDF
        loadStatus();
      } catch {
        addMessage("Upload failed. Is the server running?", "system");
      } finally {
        setBusy(false);
        fileInput.value = "";
      }
    });

    addMessage("Hi! Ask me anything about the loaded document, or upload your own PDF.", "bot");
    loadStatus();
  </script>
</body>
</html>
